version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=MyDb;User Id=sa;Password=TestPassword12!;TrustServerCertificate=True;Encrypt=False;
    volumes:
      - ./keys:/app/keys
    depends_on:
      - db

# TO CHECK IF THE MYDB IS CREATED

  db:
    image: mcr.microsoft.com/mssql/server:latest 
    container_name: sql_server_db 
    environment:
      ACCEPT_EULA: "Y" 
      SA_PASSWORD: "TestPassword12!"
    ports:
      - "1433:1433" 
    volumes:
      - sql_data:/var/opt/mssql 

volumes:
  sql_data: 